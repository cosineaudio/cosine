# Isolated local-only OIDC playground. Credentials below are DEVELOPMENT FIXTURES.
# docker compose -f compose.oidc-dev.yml up --build -d
name: cosine-oidc-dev
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --http-port=8180, --hostname=http://localhost:8180, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-keycloak-admin
    ports:
      - "127.0.0.1:8180:8180"
      - "127.0.0.1:8088:8088"
    volumes:
      - ./docker/keycloak/cosine-dev-realm.json:/opt/keycloak/data/import/cosine-dev-realm.json:ro
      - keycloakdata:/opt/keycloak/data
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Share loopback with Keycloak so the issuer URL works for both the browser
    # and the backend. The host ports for both services are published above.
    network_mode: service:keycloak
    environment:
      ASPNETCORE_URLS: http://+:8088
      ConnectionStrings__cosine: Host=postgres;Database=cosine;Username=cosine;Password=cosine-dev
      ConnectionStrings__redis: redis:6379
      Jwt__SigningKey: local-development-only-signing-key-48-characters-long
      Auth__BootstrapAdminPassword: local-cosine-admin
      Auth__Oidc__Enabled: "true"
      Auth__Oidc__DisplayName: Keycloak
      Auth__Oidc__Authority: http://localhost:8180/realms/cosine-dev
      Auth__Oidc__ClientId: cosine
      Auth__Oidc__ClientSecret: local-development-client-secret
      Auth__Oidc__PublicOrigin: http://localhost:8088
      Auth__Oidc__RequireHttpsMetadata: "false"
      Auth__Oidc__AutoProvisionUsers: "true"
      Media__RootPath: /media
      Transcoding__CachePath: /app/transcode-cache
    volumes:
      - media:/media:ro
      - transcache:/app/transcode-cache
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cosine
      POSTGRES_PASSWORD: cosine-dev
      POSTGRES_DB: cosine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cosine -d cosine]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
  transcache:
  media:
  keycloakdata:
